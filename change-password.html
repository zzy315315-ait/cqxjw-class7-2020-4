<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="direct-access-check.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="xiaohui.png">
<title>修改密码 - 谢家湾学校2020级7班 · 毕业记忆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  img{-webkit-user-drag:none;user-drag:none}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#050810;color:#e0e6f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .bg-fixed{position:fixed;inset:0;z-index:-2;background:url('starbg.jpg') center/cover no-repeat;filter:brightness(0.3) saturate(1.2)}
  .bg-overlay{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,8,16,0.75),rgba(5,8,16,0.92))}
  .card{width:100%;max-width:460px;background:rgba(20,24,44,0.7);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
  .card-header{text-align:center;margin-bottom:28px}
  .card-icon{font-size:40px;margin-bottom:12px;opacity:.8}
  .card-title{font-size:24px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#fff,#7bc0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .card-subtitle{font-size:13px;color:#7a8ab5}
  .form-group{margin-bottom:18px}
  .form-label{display:block;font-size:13px;font-weight:600;color:#a8b4d0;margin-bottom:8px;letter-spacing:0.5px}
  .form-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:#e8efff;font-size:14px;outline:none;transition:all .25s;font-family:inherit}
  .form-input:focus{border-color:rgba(91,168,255,0.5);background:rgba(91,168,255,0.08);box-shadow:0 0 0 3px rgba(91,168,255,0.1)}
  .form-input::placeholder{color:#5a6890}
  .input-wrapper{position:relative}
  .input-wrapper .toggle-pwd{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#7a8ab5;cursor:pointer;font-size:16px;padding:4px}
  .strength-bar{margin-top:10px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
  .strength-fill{height:100%;border-radius:3px;transition:all .3s;width:0}
  .strength-text{font-size:11px;margin-top:6px;color:#7a8ab5}
  .strength-weak{background:linear-gradient(90deg,#ef4444,#f87171)}
  .strength-medium{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
  .strength-strong{background:linear-gradient(90deg,#22c55e,#4ade80)}
  .strength-very-strong{background:linear-gradient(90deg,#06b6d4,#22d3ee)}
  .random-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;background:rgba(91,168,255,0.1);border:1px solid rgba(91,168,255,0.25);border-radius:8px;color:#7bc0ff;font-size:12px;cursor:pointer;transition:all .25s}
  .random-btn:hover{background:rgba(91,168,255,0.2);border-color:rgba(91,168,255,0.4)}
  .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:1px;margin-top:8px}
  .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,0.4)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-secondary{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:#a8b4d0;font-size:14px;cursor:pointer;transition:all .25s;margin-top:10px}
  .btn-secondary:hover{background:rgba(255,255,255,0.1);color:#e8efff}
  .forgot-link{text-align:center;margin-top:16px}
  .forgot-link a{color:#7bc0ff;font-size:13px;text-decoration:none;cursor:pointer;transition:color .25s}
  .forgot-link a:hover{color:#a8d4ff;text-decoration:underline}
  .back-link{text-align:center;margin-top:12px}
  .back-link a{color:#7a8ab5;font-size:13px;text-decoration:none;cursor:pointer;transition:color .25s}
  .back-link a:hover{color:#a8b4d0}
  /* Toast */
  .toast{position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-20px);padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(12px);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:rgba(34,197,94,0.9);border:1px solid rgba(74,222,128,0.3);color:#fff}
  .toast.error{background:rgba(239,68,68,0.9);border:1px solid rgba(248,113,113,0.3);color:#fff}
  .toast.info{background:rgba(59,130,246,0.9);border:1px solid rgba(96,165,250,0.3);color:#fff}
  .toast.warning{background:rgba(245,158,11,0.9);border:1px solid rgba(251,191,36,0.3);color:#fff}
  /* 环境验证遮罩 */
  .verify-overlay{position:fixed;inset:0;z-index:500;background:rgba(5,8,16,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s}
  .verify-overlay.show{opacity:1;pointer-events:auto}
  .verify-spinner{width:48px;height:48px;border:3px solid rgba(91,168,255,0.2);border-top-color:#5ba8ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .verify-text{font-size:15px;color:#a8b4d0;text-align:center;line-height:1.8}
  .verify-text b{color:#7bc0ff}
  @media(max-width:480px){.card{padding:28px 20px}.card-title{font-size:20px}}
</style>

<script src="bgm.js"></script>

<body>
<div class="bg-fixed"></div><div class="bg-overlay"></div>

<!-- 环境验证遮罩 -->
<div class="verify-overlay" id="verifyOverlay">
  <div class="verify-spinner"></div>
  <div class="verify-text" id="verifyText">正在验证登录环境...</div>
</div>

<div class="card" id="mainCard" style="display:none">
  <div class="card-header">
    <div class="card-icon">🔐</div>
    <div class="card-title">修改密码</div>
    <div class="card-subtitle" id="userInfo">当前用户：加载中...</div>
  </div>

  <div class="form-group">
    <label class="form-label">旧密码</label>
    <div class="input-wrapper">
      <input type="password" class="form-input" id="oldPwd" placeholder="请输入当前密码" autocomplete="off">
      <button class="toggle-pwd" onclick="togglePwd('oldPwd',this)" title="显示/隐藏">👁</button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">新密码</label>
    <div class="input-wrapper">
      <input type="password" class="form-input" id="newPwd" placeholder="请输入新密码" autocomplete="off" oninput="checkStrength()">
      <button class="toggle-pwd" onclick="togglePwd('newPwd',this)" title="显示/隐藏">👁</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-text" id="strengthText">密码强度：未输入</div>
    <button class="random-btn" onclick="generateRandomPwd()">🎲 生成随机强密码</button>
  </div>

  <div class="form-group">
    <label class="form-label">确认新密码</label>
    <div class="input-wrapper">
      <input type="password" class="form-input" id="confirmPwd" placeholder="请再次输入新密码" autocomplete="off">
      <button class="toggle-pwd" onclick="togglePwd('confirmPwd',this)" title="显示/隐藏">👁</button>
    </div>
  </div>

  <button class="btn-primary" id="submitBtn" onclick="changePassword()" disabled>确认修改</button>

  <div class="forgot-link">
    <a onclick="goForgot()">忘记密码？点此找回</a>
  </div>
  <div class="back-link" id="backLink">
    <a onclick="goBack()">← 返回主页</a>
  </div>
</div>

<!-- 忘记密码卡片 -->
<div class="card" id="forgotCard" style="display:none">
  <div class="card-header">
    <div class="card-icon">🔑</div>
    <div class="card-title">找回密码</div>
    <div class="card-subtitle">提交申请后，管理员会尽快为你重置密码</div>
  </div>
  <div class="form-group">
    <label class="form-label">学号</label>
    <input type="text" class="form-input" id="forgotSid" placeholder="请输入学号（老师请输入 teacher）" autocomplete="off">
  </div>
  <div class="form-group">
    <label class="form-label">姓名</label>
    <input type="text" class="form-input" id="forgotName" placeholder="请输入姓名" autocomplete="off">
  </div>
  <div class="form-group">
    <label class="form-label">新密码</label>
    <div class="input-wrapper">
      <input type="password" class="form-input" id="forgotNewPwd" placeholder="请输入新密码" autocomplete="off" oninput="checkForgotStrength()">
      <button class="toggle-pwd" onclick="togglePwd('forgotNewPwd',this)">👁</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="forgotStrengthFill"></div></div>
    <div class="strength-text" id="forgotStrengthText">密码强度：未输入</div>
    <button class="random-btn" onclick="generateRandomPwd('forgotNewPwd')">🎲 生成随机强密码</button>
  </div>
  <div class="form-group">
    <label class="form-label">确认新密码</label>
    <input type="password" class="form-input" id="forgotConfirmPwd" placeholder="请再次输入新密码" autocomplete="off">
  </div>
  <button class="btn-primary" onclick="resetPassword()">提交重置申请</button>
  <div class="back-link">
    <a onclick="backToChange()">← 返回修改密码</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 配置 =====
var SUPABASE_URL = "https://ekfntkpjqzmkibdimtru.supabase.co";
var ANON_KEY = "sb_publishable_Z3wpxD9ZRbXm9-gPPQOGZg_KKhr_yIs";

// 学号-姓名对照表（42同学+邓老师）
var STUDENT_MAP = {
  "1":"杨明叡","2":"李梓豪","3":"陶柏彦","4":"李镇宇","5":"张清源","6":"周兴","7":"唐颢原","8":"罗楚天","9":"李昊辰","10":"陈俊宇","11":"刘培正","12":"周子义","13":"张泽棵","14":"李宗潮","15":"孙榆桐","16":"刘琨正","17":"陈俊晓","18":"李博宇","19":"毛艺杰","20":"罗迦蓝","21":"赵梓成","22":"陆蔼琳","23":"叶梦涵","24":"种沁佳","25":"王正玟","26":"黄可嘉","27":"陈夏","28":"周芷觅","29":"王乙棠","30":"杨云迪","31":"孟姝菡","32":"莫钕忱","33":"黄圣意","34":"叶诗颖","35":"郭梓琳","36":"官琬钰","37":"熊湙铃","38":"吴苓萁","39":"张景怡","40":"樊禹希","41":"陈以柔","42":"陈诗颖","teacher":"邓老师"
};

var currentUser = null;
var ipVerified = false;

// ===== 页面加载：检查登录状态 + 环境验证 =====
window.addEventListener('DOMContentLoaded', function(){
  // 检查登录状态
  try{
    var sess = JSON.parse(localStorage.getItem('sb_session')||'null');
    var adm = JSON.parse(localStorage.getItem('sb_admin')||'null');
    currentUser = sess || adm;
  }catch(e){}

  if(!currentUser || !currentUser.token){
    showToast('请先登录', 'error');
    setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1500);
    return;
  }

  document.getElementById('userInfo').textContent = '当前用户：' + (currentUser.name || '用户');

  // 环境验证（IP检查）
  verifyEnvironment();
});

// ===== 环境验证：简化版，IP变动正常（电脑切手机），只做基础验证 =====
function verifyEnvironment(){
  var overlay = document.getElementById('verifyOverlay');
  var verifyText = document.getElementById('verifyText');
  overlay.classList.add('show');
  verifyText.innerHTML = '正在验证登录环境...';

  // 获取IP（仅用于记录，不因变动警告）
  fetch('https://api.ipify.org?format=json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      localStorage.setItem('last_login_ip', data.ip);
      ipVerified = true;
      verifyText.innerHTML = '<b>环境验证通过</b>';
      setTimeout(function(){ overlay.classList.remove('show'); document.getElementById('mainCard').style.display='block'; }, 800);
    })
    .catch(function(){
      ipVerified = true;
      verifyText.innerHTML = '<b>环境验证完成</b>';
      setTimeout(function(){ overlay.classList.remove('show'); document.getElementById('mainCard').style.display='block'; }, 800);
    });
}

// ===== 密码强度检测 =====
function checkStrength(){
  var pwd = document.getElementById('newPwd').value;
  var fill = document.getElementById('strengthFill');
  var text = document.getElementById('strengthText');
  var result = evalStrength(pwd);
  fill.className = 'strength-fill ' + result.class;
  fill.style.width = result.width;
  text.textContent = '密码强度：' + result.label;
  updateSubmitBtn();
}

function checkForgotStrength(){
  var pwd = document.getElementById('forgotNewPwd').value;
  var fill = document.getElementById('forgotStrengthFill');
  var text = document.getElementById('forgotStrengthText');
  var result = evalStrength(pwd);
  fill.className = 'strength-fill ' + result.class;
  fill.style.width = result.width;
  text.textContent = '密码强度：' + result.label;
}

function evalStrength(pwd){
  if(!pwd) return {class:'', width:'0', label:'未输入', level:0};
  var score = 0;
  if(pwd.length >= 6) score++;
  if(pwd.length >= 8) score++;
  if(pwd.length >= 12) score++;
  if(/[0-9]/.test(pwd)) score++;
  if(/[a-z]/.test(pwd)) score++;
  if(/[A-Z]/.test(pwd)) score++;
  if(/[^a-zA-Z0-9]/.test(pwd)) score++;

  if(score <= 2) return {class:'strength-weak', width:'25%', label:'弱（不允许）', level:1};
  if(score <= 4) return {class:'strength-medium', width:'50%', label:'中等', level:2};
  if(score <= 5) return {class:'strength-strong', width:'75%', label:'强', level:3};
  return {class:'strength-very-strong', width:'100%', label:'很强', level:4};
}

// ===== 生成随机密码 =====
function generateRandomPwd(targetId){
  var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
  var pwd = '';
  for(var i = 0; i < 14; i++){
    pwd += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  var tid = targetId || 'newPwd';
  document.getElementById(tid).value = pwd;
  document.getElementById(tid).type = 'text';
  if(tid === 'newPwd') checkStrength();
  else checkForgotStrength();
  showToast('已生成随机密码，请注意保存', 'info');
}

// ===== 切换密码显示 =====
function togglePwd(inputId, btn){
  var input = document.getElementById(inputId);
  if(input.type === 'password'){
    input.type = 'text';
    btn.textContent = '🙈';
  }else{
    input.type = 'password';
    btn.textContent = '👁';
  }
}

// ===== 更新提交按钮状态 =====
function updateSubmitBtn(){
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  var confirmPwd = document.getElementById('confirmPwd').value;
  var btn = document.getElementById('submitBtn');
  var strength = evalStrength(newPwd);

  if(oldPwd && newPwd && confirmPwd && strength.level >= 2){
    btn.disabled = false;
  }else{
    btn.disabled = true;
  }
}

document.getElementById('oldPwd').addEventListener('input', updateSubmitBtn);
document.getElementById('confirmPwd').addEventListener('input', updateSubmitBtn);

// ===== 修改密码 =====
function changePassword(){
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  var confirmPwd = document.getElementById('confirmPwd').value;
  var btn = document.getElementById('submitBtn');

  if(!oldPwd){ showToast('请输入旧密码', 'error'); return; }
  if(!newPwd){ showToast('请输入新密码', 'error'); return; }
  if(newPwd === oldPwd){ showToast('新密码不能与旧密码相同，请设置不同的密码', 'error'); return; }
  if(newPwd !== confirmPwd){ showToast('两次输入的新密码不一致，请重新输入', 'error'); return; }

  var strength = evalStrength(newPwd);
  if(strength.level < 2){ showToast('密码强度太弱，请设置更复杂的密码', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '修改中...';

  // 先用旧密码验证身份（重新登录验证）
  var email = currentUser.email || (currentUser.student_id ? currentUser.student_id + '@class20207.com' : '');
  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {'apikey': ANON_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, password: oldPwd})
  })
  .then(function(r){
    if(!r.ok) throw new Error('旧密码错误');
    return r.json();
  })
  .then(function(){
    // 旧密码验证通过，修改密码
    return fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + currentUser.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({password: newPwd})
    });
  })
  .then(function(r){
    if(!r.ok) return r.json().then(function(e){ throw new Error(e.msg || '修改失败'); });
    return r.json();
  })
  .then(function(){
    showToast('密码修改成功！', 'success');
    // 记录已修改密码
    localStorage.setItem('pwd_changed_' + currentUser.uid, '1');
    // 如果是强制修改密码模式，清除强制标记
    if(isForceChangePwd){
      sessionStorage.removeItem('force_change_pwd');
    }
    setTimeout(function(){
      if(isForceChangePwd){
        // 强制修改密码模式下，修改成功后跳转到主页
        if(currentUser && (currentUser.role === 'admin' || currentUser.role === 'super_admin')){
          location.href = 'https://cqxjw-class7-2020-2.pages.dev/admin-main.html';
        }else{
          location.href = 'https://cqxjw-class7-2020-2.pages.dev/a3x7k2m9p4q8r3t6w1y5u0i2o4.html';
        }
      }else{
        goBack();
      }
    }, 1500);
  })
  .catch(function(err){
    showToast(err.message || '修改失败', 'error');
    btn.disabled = false;
    btn.textContent = '确认修改';
  });
}

// ===== 忘记密码 =====
function goForgot(){
  document.getElementById('mainCard').style.display = 'none';
  document.getElementById('forgotCard').style.display = 'block';
}

function backToChange(){
  document.getElementById('forgotCard').style.display = 'none';
  document.getElementById('mainCard').style.display = 'block';
}

function resetPassword(){
  var sid = document.getElementById('forgotSid').value.trim();
  var name = document.getElementById('forgotName').value.trim();
  var newPwd = document.getElementById('forgotNewPwd').value;
  var confirmPwd = document.getElementById('forgotConfirmPwd').value;

  // 提交频率限制：5分钟内只能提交一次密码重置申请
  var lastSubmit = parseInt(localStorage.getItem('last_reset_submit') || '0');
  if(Date.now() - lastSubmit < 300000){
    var wait = Math.ceil((300000 - (Date.now() - lastSubmit)) / 60000);
    showToast('提交太频繁了，请等待 ' + wait + ' 分钟后再试', 'error');
    return;
  }

  if(!sid){ showToast('请输入学号', 'error'); return; }
  if(!name){ showToast('请输入姓名', 'error'); return; }
  if(!newPwd){ showToast('请输入新密码', 'error'); return; }
  if(newPwd !== confirmPwd){ showToast('两次新密码不一致', 'error'); return; }

  var strength = evalStrength(newPwd);
  if(strength.level < 2){ showToast('密码强度太弱', 'error'); return; }

  // 验证学号和姓名是否匹配
  var expectedName = STUDENT_MAP[sid];
  if(!expectedName){ showToast('学号不存在', 'error'); return; }
  if(expectedName !== name){ showToast('学号与姓名不匹配', 'error'); return; }

  // 提交密码重置申请到数据库
  var btn = event.target;
  btn.disabled = true;
  btn.textContent = '提交中...';

  fetch(SUPABASE_URL + '/rest/v1/password_resets', {
    method: 'POST',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      student_id: sid,
      name: name,
      requested_password: newPwd,
      status: 'pending'
    })
  })
  .then(function(r){
    if(r.ok){
      showToast('✅ 重置申请已提交！管理员将尽快处理', 'success');
      localStorage.setItem('last_reset_submit', String(Date.now()));
      setTimeout(function(){ backToChange(); }, 2500);
    }else{
      return r.json().then(function(e){ throw new Error(e.message || '提交失败'); });
    }
  })
  .catch(function(err){
    showToast('提交失败：' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = '提交重置申请';
  });
}

// ===== 强制修改密码模式检测 =====
var isForceChangePwd = false;
(function(){
  var urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('force') === '1' || sessionStorage.getItem('force_change_pwd') === '1'){
    isForceChangePwd = true;
    sessionStorage.setItem('force_change_pwd', '1');
    // 隐藏返回按钮
    var backLink = document.getElementById('backLink');
    if(backLink) backLink.style.display = 'none';
    // 隐藏忘记密码链接（强制修改密码模式下不允许找回密码）
    var forgotLink = document.querySelector('.forgot-link');
    if(forgotLink) forgotLink.style.display = 'none';
    // 修改标题
    var cardTitle = document.querySelector('.card-title');
    if(cardTitle) cardTitle.textContent = '必须修改密码';
    var cardSubtitle = document.querySelector('.card-subtitle');
    if(cardSubtitle) cardSubtitle.textContent = '为了账号安全，请先修改默认密码后才能继续使用';
  }
})();

// ===== 返回 =====
function goBack(){
  if(isForceChangePwd){
    showToast('为了账号安全，请先修改密码', 'error');
    return;
  }
  if(sessionStorage.getItem('mode') === 'visitor'){
    location.href = 'https://cqxjw-class7-2020-2.pages.dev/visitor.html';
  }else if(currentUser && (currentUser.role === 'admin' || currentUser.role === 'super_admin')){
    location.href = 'https://cqxjw-class7-2020-2.pages.dev/admin-main.html';
  }else{
    location.href = 'https://cqxjw-class7-2020-2.pages.dev/a3x7k2m9p4q8r3t6w1y5u0i2o4.html';
  }
}

// ===== Toast =====
function showToast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'info');
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
</script>
