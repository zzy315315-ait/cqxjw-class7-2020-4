<style>

  .random-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;background:rgba(91,168,255,0.1);border:1px solid rgba(91,168,255,0.25);border-radius:8px;color:#7bc0ff;font-size:12px;cursor:pointer;transition:all .25s}

<!-- 环境验证遮罩 -->

  <div class="verify-spinner"></div>

</div>

<div class="card" id="mainCard" style="display:none">
  <div class="card-header">
    <div class="card-icon">🔐</div>
    <div class="card-title">修改密码</div>
    <div class="card-subtitle" id="userInfo">当前用户：加载中...</div>

  <div class="form-group">
    <label class="form-label">旧密码</label>
    <div class="input-wrapper">

  </div>

  <div class="form-group">
    <label class="form-label">确认新密码</label>

      <button class="toggle-pwd" onclick="togglePwd('confirmPwd',this)" title="显示/隐藏">👁</button>

  </div>

  <button class="btn-primary" id="submitBtn" onclick="changePassword()" disabled>确认修改</button>

  <div class="forgot-link">

    <a onclick="goBack()">← 返回主页</a>
  </div>
</div>

<!-- 忘记密码卡片 -->
<div class="card" id="forgotCard" style="display:none">
  <div class="card-header">
    <div class="card-icon">🔑</div>
    <div class="card-title">找回密码</div>
    <div class="card-subtitle">提交申请后，管理员会尽快为你重置密码</div>
  </div>
  <div class="form-group">
    <label class="form-label">学号</label>
    <input type="text" class="form-input" id="forgotSid" placeholder="请输入学号（老师请输入 teacher）" autocomplete="off">
  </div>
  <div class="form-group">
    <label class="form-label">姓名</label>

    <label class="form-label">新密码</label>

  </div>
  <div class="form-group">
    <label class="form-label">确认新密码</label>

<div class="toast" id="toast"></div>

<script>
// ===== 配置 =====
var SUPABASE_URL = "https://ekfntkpjqzmkibdimtru.supabase.co";
var ANON_KEY = "sb_publishable_Z3wpxD9ZRbXm9-gPPQOGZg_KKhr_yIs";

// 管理员 UID 白名单（与管理员主页/设置页保持一致）
var ADMIN_UIDS = ["919f3af0-801d-4d7b-87b4-03bedc9d2896", "6522e17f-14ea-4f1f-b20d-10457d598fef"];
// 跨仓库跳转目标（仓库2）
var HOME_PAGE = "https://cqxjw-class7-2020-2.pages.dev/a3x7k2m9p4q8r3t6w1y5u0i2o4.html";
var ADMIN_HOME_PAGE = "https://cqxjw-class7-2020-2.pages.dev/admin-main.html";
var LOGIN_PAGE = "https://cqxjw-class7-2020.pages.dev/login.html";

// 学号-姓名对照表（42同学+邓老师）
var STUDENT_MAP = {
  "1":"杨明叡","2":"李梓豪","3":"陶柏彦","4":"李镇宇","5":"张清源","6":"周兴","7":"唐颢原","8":"罗楚天","9":"李昊辰","10":"陈俊宇","11":"刘培正","12":"周子义","13":"张泽棵","14":"李宗潮","15":"孙榆桐","16":"刘琨正","17":"陈俊晓","18":"李博宇","19":"毛艺杰","20":"罗迦蓝","21":"赵梓成","22":"陆蔼琳","23":"叶梦涵","24":"种沁佳","25":"王正玟","26":"黄可嘉","27":"陈夏","28":"周芷觅","29":"王乙棠","30":"杨云迪","31":"孟姝菡","32":"莫钕忱","33":"黄圣意","34":"叶诗颖","35":"郭梓琳","36":"官琬钰","37":"熊湙铃","38":"吴苓萁","39":"张景怡","40":"樊禹希","41":"陈以柔","42":"陈诗颖","teacher":"邓老师"
};

var currentUser = null;
var ipVerified = false;

// ===== 页面加载：检查登录状态 + 环境验证 =====
window.addEventListener('DOMContentLoaded', function(){
  // 登录状态：跨域进入时 ?auth= 已由 xauth.js 同步落盘，优先从 XAUTH 取
  try{
    if(window.XAUTH && XAUTH.getUser()){
      currentUser = XAUTH.getUser();
    }else{
      // 兼容旧版本地存储（同域刷新等场景）
      var sess = JSON.parse(localStorage.getItem('sb_session')||sessionStorage.getItem('sb_session')||'null');
      var adm = JSON.parse(localStorage.getItem('sb_admin')||sessionStorage.getItem('sb_admin')||'null');
      currentUser = sess || adm;
    }
  }catch(e){}

  if(!currentUser || (!currentUser.uid && !currentUser.token)){
    showToast('请先登录', 'error');
    setTimeout(function(){ location.href = (window.XAUTH ? XAUTH.LOGIN_PAGE : LOGIN_PAGE); }, 1500);
    return;
  }

  document.getElementById('userInfo').textContent = '当前用户：' + (currentUser.name || '用户');

  // 环境验证（IP检查）
  verifyEnvironment();
});

// ===== 环境验证：简化版，IP变动正常（电脑切手机），只做基础验证 =====
function verifyEnvironment(){
  var overlay = document.getElementById('verifyOverlay');
  var verifyText = document.getElementById('verifyText');
  overlay.classList.add('show');
  verifyText.innerHTML = '正在验证登录环境...';

  // 兜底：IP 接口异常/超时时也不能一直挡着页面（最多 2.5 秒）
  setTimeout(function(){
    overlay.classList.remove('show');
    document.getElementById('mainCard').style.display = 'block';
  }, 2500);

  // 获取IP（仅用于记录，不因变动警告）
  fetch('https://api.ipify.org?format=json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      localStorage.setItem('last_login_ip', data.ip);
      ipVerified = true;
      verifyText.innerHTML = '<b>环境验证通过</b>';
      setTimeout(function(){ overlay.classList.remove('show'); document.getElementById('mainCard').style.display='block'; }, 800);
    })
    .catch(function(){
      ipVerified = true;
      verifyText.innerHTML = '<b>环境验证完成</b>';
      setTimeout(function(){ overlay.classList.remove('show'); document.getElementById('mainCard').style.display='block'; }, 800);
    });
}

// ===== 密码强度检测 =====
function checkStrength(){
  var pwd = document.getElementById('newPwd').value;
  var fill = document.getElementById('strengthFill');
  var text = document.getElementById('strengthText');
  var result = evalStrength(pwd);
  fill.className = 'strength-fill ' + result.class;
  fill.style.width = result.width;
  text.textContent = '密码强度：' + result.label;
  updateSubmitBtn();
}

function checkForgotStrength(){
  var pwd = document.getElementById('forgotNewPwd').value;
  var fill = document.getElementById('forgotStrengthFill');
  var text = document.getElementById('forgotStrengthText');
  var result = evalStrength(pwd);
  fill.className = 'strength-fill ' + result.class;
  fill.style.width = result.width;
  text.textContent = '密码强度：' + result.label;
}

function evalStrength(pwd){
  if(!pwd) return {class:'', width:'0', label:'未输入', level:0};
  var score = 0;
  if(pwd.length >= 6) score++;
  if(pwd.length >= 8) score++;
  if(pwd.length >= 12) score++;
  if(/[0-9]/.test(pwd)) score++;
  if(/[a-z]/.test(pwd)) score++;
  if(/[A-Z]/.test(pwd)) score++;
  if(/[^a-zA-Z0-9]/.test(pwd)) score++;

  if(score <= 2) return {class:'strength-weak', width:'25%', label:'弱（不允许）', level:1};
  if(score <= 4) return {class:'strength-medium', width:'50%', label:'中等', level:2};
  if(score <= 5) return {class:'strength-strong', width:'75%', label:'强', level:3};
  return {class:'strength-very-strong', width:'100%', label:'很强', level:4};
}

// ===== 生成随机密码 =====
function generateRandomPwd(targetId){
  var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
  var pwd = '';
  for(var i = 0; i < 14; i++){
    pwd += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  var tid = targetId || 'newPwd';
  document.getElementById(tid).value = pwd;
  document.getElementById(tid).type = 'text';
  if(tid === 'newPwd') checkStrength();
  else checkForgotStrength();
  showToast('已生成随机密码，请注意保存', 'info');
}

// ===== 切换密码显示 =====
function togglePwd(inputId, btn){
  var input = document.getElementById(inputId);
  if(input.type === 'password'){
    input.type = 'text';
    btn.textContent = '🙈';
  }else{
    input.type = 'password';
    btn.textContent = '👁';
  }
}

// ===== 更新提交按钮状态 =====
function updateSubmitBtn(){
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  var confirmPwd = document.getElementById('confirmPwd').value;
  var btn = document.getElementById('submitBtn');
  var strength = evalStrength(newPwd);

  if(oldPwd && newPwd && confirmPwd && newPwd.length >= 6 && strength.level >= 2){
    btn.disabled = false;
  }else{
    btn.disabled = true;
  }
}

document.getElementById('oldPwd').addEventListener('input', updateSubmitBtn);
document.getElementById('confirmPwd').addEventListener('input', updateSubmitBtn);

// ===== 修改密码 =====
// 判断是否管理员（角色 admin/super_admin 或 UID 在白名单）
function isAdminUser(user){
  if(!user) return false;
  if(user.role === 'admin' || user.role === 'super_admin') return true;
  return !!(user.uid && ADMIN_UIDS.indexOf(user.uid) >= 0);
}

// 当前账号邮箱（登录用）
function getUserEmail(user){
  if(!user) return '';
  if(user.email) return user.email;
  return user.student_id ? user.student_id + '@class20207.com' : '';
}

// 用邮箱+密码登录（旧密码验证 / 改密后换新 token 都用它）
function loginWithPassword(email, password){
  return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {'apikey': ANON_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, password: password})
  });
}

// 重置提交按钮
function resetSubmitBtn(){
  var btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '确认修改';
}

// 跳登录页（登录态过期时用，避免死循环）
function goLoginPage(msg){
  showToast(msg || '登录状态已过期，请重新登录', 'error');
  var target = (window.XAUTH ? XAUTH.LOGIN_PAGE : LOGIN_PAGE);
  setTimeout(function(){ location.href = target; }, 1500);
}

// 组装 user_metadata：password_changed 为本次核心标记；
// 同时回填已知字段，防止 GoTrue 的 data 语义覆盖掉原有 name/role 元数据
function buildPasswordMeta(user){
  var meta = { password_changed: true };
  if(user){
    if(user.name) meta.name = user.name;
    if(user.student_id) meta.student_id = user.student_id;
    if(user.role) meta.role = user.role;
  }
  return meta;
}

function changePassword(){
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  var confirmPwd = document.getElementById('confirmPwd').value;
  var btn = document.getElementById('submitBtn');

  if(!oldPwd){ showToast('请输入旧密码', 'error'); return; }
  if(!newPwd){ showToast('请输入新密码', 'error'); return; }
  if(newPwd.length < 6){ showToast('新密码至少 6 位，请重新输入', 'error'); return; }
  if(newPwd === oldPwd){ showToast('新密码不能与旧密码相同，请设置不同的密码', 'error'); return; }
  if(newPwd !== confirmPwd){ showToast('两次输入的新密码不一致，请重新输入', 'error'); return; }

  var strength = evalStrength(newPwd);
  if(strength.level < 2){ showToast('密码强度太弱，请设置更复杂的密码', 'error'); return; }

  var email = getUserEmail(currentUser);
  if(!email){ showToast('无法识别当前账号邮箱，请重新登录', 'error'); return; }

  // 初始密码规则：学号重复拼满6位。输入的就是原始学号（默认密码）时转换；已改过密码则原样提交。
  var oldPwdSend = oldPwd;
  var _cpSid = currentUser.student_id ? String(currentUser.student_id) : '';
  if(_cpSid && /^\d+$/.test(oldPwdSend) && oldPwdSend === _cpSid){
    var _cpT = _cpSid; while(_cpT.length < 6){ _cpT += _cpSid; } oldPwdSend = _cpT.slice(0,6);
  }

  btn.disabled = true;
  btn.textContent = '修改中...';

  // 第 1 步：用旧密码验证身份（防止他人拿已登录设备改密）
  loginWithPassword(email, oldPwdSend)
  .then(function(r){
    if(!r.ok) throw new Error('旧密码错误');
    return r.json();
  })
  .then(function(){
    // 第 2 步：一次请求完成“改密码 + 写入 password_changed 元数据”。
    // 关键：必须用改密前的 token，且 401/403 时不能再拿旧 token 重试。
    return fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + currentUser.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({password: newPwd, data: buildPasswordMeta(currentUser)})
    });
  })
  .then(function(r){
    if(!r.ok){
      if(r.status === 401 || r.status === 403){
        var expiredErr = new Error('登录状态已过期，请重新登录');
        expiredErr.expired = true;
        throw expiredErr;
      }
      return r.text().then(function(text){
        var msg = '修改失败';
        try{
          var e = JSON.parse(text);
          msg = e.msg || e.message || e.error_description || msg;
        }catch(parseErr){
          if(text) msg = String(text).slice(0, 120);
        }
        throw new Error(msg);
      });
    }
    return r.json();
  })
  .then(function(){
    // 改密成功后旧 token 立即失效，这里只记录本域标记
    try{
      localStorage.setItem('pwd_changed_' + currentUser.uid, '1');
      localStorage.removeItem('force_pending_' + currentUser.uid);
    }catch(e){}
    // 第 3 步：用新密码重新登录，换一个新的 access_token
    return loginWithPassword(email, newPwd);
  })
  .then(function(r){
    if(!r.ok) return null;
    return r.json();
  })
  .then(function(tokenData){
    if(!tokenData || !tokenData.access_token){
      // 密码已改成功，但新 token 没拿到：清强制标记并让用户用新密码重新登录
      try{
        sessionStorage.removeItem('force_change_pwd');
        localStorage.removeItem('force_pending_' + currentUser.uid);
      }catch(e){}
      showToast('密码已修改，请用新密码重新登录', 'success');
      var loginTarget = (window.XAUTH ? XAUTH.LOGIN_PAGE : LOGIN_PAGE);
      setTimeout(function(){ location.href = loginTarget; }, 1500);
      return;
    }

    var uid = currentUser.uid;
    var name = currentUser.name || '';
    var studentId = currentUser.student_id || '';
    var role = currentUser.role || 'student';
    if(tokenData.user){
      uid = tokenData.user.id || uid;
      var meta = tokenData.user.user_metadata || {};
      name = meta.name || meta.nickname || name;
      studentId = meta.student_id || studentId;
      if(meta.role) role = meta.role;
    }

    // 覆盖本地会话（新 token + 约 30 天有效期），供后续 XAUTH.go 带给其他站点
    if(window.XAUTH){
      XAUTH.saveUser({
        uid: uid,
        name: name,
        email: email,
        student_id: studentId,
        role: role,
        token: tokenData.access_token,
        exp: Date.now() + 30 * 24 * 60 * 60 * 1000
      });
    }else{
      var session = {
        uid: uid, name: name, email: email, student_id: studentId, role: role,
        token: tokenData.access_token, exp: Date.now() + 30 * 24 * 60 * 60 * 1000
      };
      try{
        localStorage.setItem('sb_session', JSON.stringify(session));
        localStorage.setItem('logged_in', '1');
      }catch(e){}
    }

    // 强制改密模式：清除强制标记
    try{ sessionStorage.removeItem('force_change_pwd'); }catch(e){}

    // 写入系统通知到消息中心
    if(uid){
      fetch(SUPABASE_URL + '/rest/v1/user_messages', {
        method: 'POST',
        headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + tokenData.access_token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
        body: JSON.stringify({user_id: uid, title: '密码修改成功', content: '你的登录密码已修改成功。如非本人操作，请及时联系管理员。', msg_type: 'system', is_read: false})
      }).catch(function(){});
    }

    showToast('密码修改成功', 'success');
    setTimeout(function(){
      var target = isAdminUser({uid: uid, role: role}) ? ADMIN_HOME_PAGE : HOME_PAGE;
      if(window.XAUTH){
        XAUTH.go(target);
      }else{
        location.href = target;
      }
    }, 1200);
  })
  .catch(function(err){
    resetSubmitBtn();
    if(err && err.expired){
      goLoginPage('登录状态已过期，请重新登录');
      return;
    }
    showToast((err && err.message) ? err.message : '修改失败，请重试', 'error');
  });
}

// ===== 忘记密码 =====
function goForgot(){
  document.getElementById('mainCard').style.display = 'none';
  document.getElementById('forgotCard').style.display = 'block';
}

function backToChange(){
  document.getElementById('forgotCard').style.display = 'none';
  document.getElementById('mainCard').style.display = 'block';
}

function resetPassword(){
  var sid = document.getElementById('forgotSid').value.trim();
  var name = document.getElementById('forgotName').value.trim();
  var newPwd = document.getElementById('forgotNewPwd').value;
  var confirmPwd = document.getElementById('forgotConfirmPwd').value;

  // 提交频率限制：5分钟内只能提交一次密码重置申请
  var lastSubmit = parseInt(localStorage.getItem('last_reset_submit') || '0');
  if(Date.now() - lastSubmit < 300000){
    var wait = Math.ceil((300000 - (Date.now() - lastSubmit)) / 60000);
    showToast('提交太频繁了，请等待 ' + wait + ' 分钟后再试', 'error');
    return;
  }

  if(!sid){ showToast('请输入学号', 'error'); return; }
  if(!name){ showToast('请输入姓名', 'error'); return; }
  if(!newPwd){ showToast('请输入新密码', 'error'); return; }
  if(newPwd.length < 6){ showToast('新密码至少 6 位，请重新输入', 'error'); return; }
  if(newPwd !== confirmPwd){ showToast('两次新密码不一致', 'error'); return; }

  var strength = evalStrength(newPwd);
  if(strength.level < 2){ showToast('密码强度太弱', 'error'); return; }

  // 验证学号和姓名是否匹配
  var expectedName = STUDENT_MAP[sid];
  if(!expectedName){ showToast('学号不存在', 'error'); return; }
  if(expectedName !== name){ showToast('学号与姓名不匹配', 'error'); return; }

  // 提交密码重置申请到数据库
  var btn = event.target;
  btn.disabled = true;
  btn.textContent = '提交中...';

  fetch(SUPABASE_URL + '/rest/v1/password_resets', {
    method: 'POST',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      student_id: sid,
      name: name,
      requested_password: newPwd,
      status: 'pending'
    })
  })
  .then(function(r){
    if(r.ok){
      showToast('✅ 重置申请已提交！管理员将尽快处理', 'success');
      localStorage.setItem('last_reset_submit', String(Date.now()));
      setTimeout(function(){ backToChange(); }, 2500);
    }else{
      return r.json().then(function(e){ throw new Error(e.message || '提交失败'); });
    }
  })
  .catch(function(err){
    showToast('提交失败：' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = '提交重置申请';
  });
}

// ===== 强制修改密码模式检测 =====
var isForceChangePwd = false;
(function(){
  var urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('force') === '1' || sessionStorage.getItem('force_change_pwd') === '1'){
    isForceChangePwd = true;
    sessionStorage.setItem('force_change_pwd', '1');
    // 隐藏返回按钮
    var backLink = document.getElementById('backLink');
    if(backLink) backLink.style.display = 'none';
    // 隐藏忘记密码链接（强制修改密码模式下不允许找回密码）
    var forgotLink = document.querySelector('.forgot-link');
    if(forgotLink) forgotLink.style.display = 'none';
    // 修改标题
    var cardTitle = document.querySelector('.card-title');
    if(cardTitle) cardTitle.textContent = '必须修改密码';
    var cardSubtitle = document.querySelector('.card-subtitle');
    if(cardSubtitle) cardSubtitle.textContent = '为了账号安全，请先修改默认密码后才能继续使用';
  }
})();

// ===== 返回 =====
// 跨仓库跳转：必须带身份（登录用户带 auth，访客带 guest=1），否则目标站会当成未登录
function crossGo(url){
  if(window.XAUTH){
    XAUTH.go(url);
  }else{
    location.href = url;
  }
}

function goBack(){
  if(isForceChangePwd){
    showToast('为了账号安全，请先修改密码', 'error');
    return;
  }
  if((window.XAUTH && XAUTH.isGuest()) || sessionStorage.getItem('mode') === 'visitor'){
    crossGo('https://cqxjw-class7-2020-2.pages.dev/visitor.html');
  }else if(currentUser && isAdminUser(currentUser)){
    crossGo(ADMIN_HOME_PAGE);
  }else if(currentUser){
    crossGo(HOME_PAGE);
  }else{
    location.href = (window.XAUTH ? XAUTH.LOGIN_PAGE : LOGIN_PAGE);
  }
}

// ===== Toast =====
function showToast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'info');
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
