<script>
// 立即执行初始化，确保页面能正常加载
(function(){
  console.log('settings脚本开始执行');
  window.onerror = function(msg, url, line, col, error){
    console.error('JavaScript错误:', msg, '行:', line, '错误:', error);
    alert('页面加载出错: ' + msg + ' (行:' + line + ')');
  };
})();

var SUPABASE_URL = "https://ekfntkpjqzmkibdimtru.supabase.co";
var ANON_KEY = "sb_publishable_Z3wpxD9ZRbXm9-gPPQOGZg_KKhr_yIs";
var currentUser = null;

window.addEventListener('DOMContentLoaded', function(){
  console.log('settings页面加载开始');
  // 登录状态检测（同时检查localStorage和sessionStorage）
  try{
    var sessStr = localStorage.getItem('sb_session') || sessionStorage.getItem('sb_session') || 'null';
    var admStr = localStorage.getItem('sb_admin') || sessionStorage.getItem('sb_admin') || 'null';
    console.log('sb_session:', sessStr ? '存在' : '不存在');
    console.log('sb_admin:', admStr ? '存在' : '不存在');
    var sess = null;
    var adm = null;
    try{ sess = JSON.parse(sessStr); }catch(e){ console.error('解析sb_session失败:', e); }
    try{ adm = JSON.parse(admStr); }catch(e){ console.error('解析sb_admin失败:', e); }
    currentUser = sess || adm;
    console.log('currentUser:', currentUser ? currentUser.name : 'null');
    if(!currentUser || !currentUser.token){
      showToast('请先登录', 'error');
      setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1500);
      return;
    }
  }catch(e){
    console.error('登录状态检测异常:', e);
    location.href = 'https://cqxjw-class7-2020.pages.dev/login.html';
    return;
  }

  // 显示用户信息
  document.getElementById('userName').textContent = currentUser.name || '用户';
  document.getElementById('userAvatar').textContent = (currentUser.name || '?').charAt(0);
  document.getElementById('userSid').textContent = currentUser.student_id || (currentUser.email ? currentUser.email.split('@')[0] : '--');
  document.getElementById('userUid').textContent = currentUser.uid ? currentUser.uid.substring(0,8) : '--';
  document.getElementById('userEmail').textContent = currentUser.email || '--';

  var role = currentUser.role || 'student';
  // role白名单验证，防止XSS和属性注入
  var safeRole = ['student','teacher','admin','super_admin','unrestricted'].indexOf(role) >= 0 ? role : 'student';
  var roleText = {student:'学生', teacher:'老师', admin:'管理员', super_admin:'超级管理员', unrestricted:'不受管控'}[safeRole];
  var roleClass = 'role-' + safeRole;
  document.getElementById('userRole').innerHTML = '<span class="role-tag ' + roleClass + '">' + roleText + '</span>';
  document.getElementById('userRoleDesc').textContent = roleText + ' · 2020级7班';
  document.getElementById('newNickname').value = currentUser.name || '';
  
  // 显示账号安全信息
  try{
    var lastLogin = localStorage.getItem('last_login_time');
    if(lastLogin){
      document.getElementById('lastLoginTime').textContent = new Date(parseInt(lastLogin)).toLocaleString('zh-CN');
    }else{
      document.getElementById('lastLoginTime').textContent = '未知';
    }
    var loginCnt = localStorage.getItem('login_count_' + currentUser.uid);
    if(loginCnt){
      document.getElementById('loginCount').textContent = loginCnt + ' 次';
    }else{
      document.getElementById('loginCount').textContent = '1 次';
    }
  }catch(e){}

  loadMyMessages();
  loadMyTickets();
});

// 一键复制文本
function copyText(elementId, label){
  var el = document.getElementById(elementId);
  if(!el) return;
  var text = el.textContent || el.innerText || '';
  if(!text || text === '--'){
    showToast('暂无' + label + '可复制', 'error');
    return;
  }
  // 使用现代API复制
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showToast(label + '已复制到剪贴板', 'success');
    }).catch(function(){
      fallbackCopy(text, label);
    });
  }else{
    fallbackCopy(text, label);
  }
}

// 降级复制方案
function fallbackCopy(text, label){
  var textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try{
    document.execCommand('copy');
    showToast(label + '已复制到剪贴板', 'success');
  }catch(e){
    showToast('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(textarea);
}

// 一键复制全部信息
function copyAllInfo(){
  if(!currentUser){
    showToast('用户信息加载中，请稍候', 'error');
    return;
  }
  var roleText = {student:'学生', teacher:'老师', admin:'管理员', super_admin:'超级管理员', unrestricted:'不受管控'}[currentUser.role] || currentUser.role || '未知';
  var allInfo = '【个人信息】\n' +
    '姓名：' + (currentUser.name || '未知') + '\n' +
    '学号：' + (currentUser.student_id || (currentUser.email ? currentUser.email.split('@')[0] : '未知')) + '\n' +
    '角色：' + roleText + '\n' +
    'UID：' + (currentUser.uid || '未知') + '\n' +
    '邮箱：' + (currentUser.email || '未知');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(allInfo).then(function(){
      showToast('全部信息已复制到剪贴板', 'success');
    }).catch(function(){
      fallbackCopy(allInfo, '全部信息');
    });
  }else{
    fallbackCopy(allInfo, '全部信息');
  }
}

// 退出登录
function logout(){
  if(!confirm('确定要退出登录吗？')) return;
  try{
    // 清除所有登录状态
    localStorage.removeItem('sb_session');
    localStorage.removeItem('sb_admin');
    localStorage.removeItem('sb_user');
    localStorage.removeItem('logged_in');
    localStorage.removeItem('login_expire');
    localStorage.removeItem('is_admin');
    localStorage.removeItem('keep_login');
    sessionStorage.removeItem('sb_session');
    sessionStorage.removeItem('sb_admin');
    sessionStorage.removeItem('sb_user');
    sessionStorage.removeItem('logged_in');
    sessionStorage.removeItem('is_admin');
    sessionStorage.removeItem('visitor_verified');
    sessionStorage.removeItem('mode');
  }catch(e){}
  showToast('已退出登录', 'success');
  setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1000);
}

function loadMyMessages(){
  fetch(SUPABASE_URL + '/rest/v1/messages?select=*&uid=eq.' + currentUser.uid + '&order=created_at.desc', {
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + currentUser.token}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data || data.length === 0){
      document.getElementById('myMessages').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">还没有留过言</div></div>';
      document.getElementById('myMsgCount').textContent = '';
      return;
    }
    document.getElementById('myMsgCount').textContent = '(' + data.length + ')';
    var html = '';
    data.forEach(function(m){
      var time = new Date(m.created_at).toLocaleString('zh-CN');
      html += '<div class="my-item"><div class="my-item-content">' + escapeHtml(m.content || '') + '</div><div class="my-item-time">' + time + '</div></div>';
    });
    document.getElementById('myMessages').innerHTML = html;
  })
  .catch(function(){
    document.getElementById('myMessages').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败</div></div>';
  });
}

function loadMyTickets(){
  fetch(SUPABASE_URL + '/rest/v1/support_tickets?select=*&user_id=eq.' + currentUser.uid + '&order=created_at.desc', {
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + currentUser.token}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data || data.length === 0){
      document.getElementById('myTickets').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">还没有提交过反馈</div></div>';
      document.getElementById('myTicketCount').textContent = '';
      return;
    }
    document.getElementById('myTicketCount').textContent = '(' + data.length + ')';
    var html = '';
    data.forEach(function(t){
      var time = new Date(t.created_at).toLocaleString('zh-CN');
      var statusText = t.status === 'processed' ? '✅ 已处理' : '⏳ 待处理';
      var reply = t.admin_reply ? '<div style="margin-top:6px;padding:8px 12px;background:rgba(34,197,94,0.08);border-radius:6px;border-left:2px solid #4ade80"><span style="color:#4ade80;font-size:11px;font-weight:600">管理员回复：</span><br><span style="color:#a8b4d0;font-size:12px">' + escapeHtml(t.admin_reply) + '</span></div>' : '';
      html += '<div class="my-item"><div class="my-item-content">' + escapeHtml(t.message || '') + '</div><div class="my-item-time">' + time + ' · ' + statusText + '</div>' + reply + '</div>';
    });
    document.getElementById('myTickets').innerHTML = html;
  })
  .catch(function(){
    document.getElementById('myTickets').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败</div></div>';
  });
}

function saveNickname(){
  var newName = document.getElementById('newNickname').value.trim();
  if(!newName){ showToast('昵称不能为空', 'error'); return; }
  if(newName.length > 30){ showToast('昵称最多30个字符', 'error'); return; }
  if(newName === currentUser.name){ showToast('昵称没有变化', 'info'); return; }

  // 先检查student_profiles表中是否有用户记录
  fetch(SUPABASE_URL + '/rest/v1/student_profiles?user_id=eq.' + currentUser.uid, {
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + currentUser.token}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data && data.length > 0){
      // 有记录，更新
      return fetch(SUPABASE_URL + '/rest/v1/student_profiles?user_id=eq.' + currentUser.uid, {
        method: 'PATCH',
        headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + currentUser.token, 'Content-Type': 'application/json'},
        body: JSON.stringify({name: newName, updated_at: new Date().toISOString()})
      });
    }else{
      // 没有记录，创建
      return fetch(SUPABASE_URL + '/rest/v1/student_profiles', {
        method: 'POST',
        headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + currentUser.token, 'Content-Type': 'application/json'},
        body: JSON.stringify({
          user_id: currentUser.uid,
          name: newName,
          student_id: currentUser.student_id || '',
          email: currentUser.email || '',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        })
      });
    }
  })
  .then(function(r){
    if(r.ok || r.status === 200 || r.status === 201){
      // 更新本地session
      currentUser.name = newName;
      ['sb_session', 'sb_admin'].forEach(function(key){
        if(localStorage.getItem(key)){
          var sess = JSON.parse(localStorage.getItem(key));
          sess.name = newName;
          localStorage.setItem(key, JSON.stringify(sess));
        }
        if(sessionStorage.getItem(key)){
          var sess = JSON.parse(sessionStorage.getItem(key));
          sess.name = newName;
          sessionStorage.setItem(key, JSON.stringify(sess));
        }
      });
      document.getElementById('userName').textContent = newName;
      document.getElementById('userAvatar').textContent = newName.charAt(0);
      showToast('昵称修改成功', 'success');
    }else{
      return r.text().then(function(e){ throw new Error(e || '修改失败，可能权限不足'); });
    }
  })
  .catch(function(err){
    showToast('修改失败：' + err.message, 'error');
  });
}

function logout(){
  if(!confirm('确认退出登录？')) return;
  try{
    var keysToRemove = [
      'sb_session', 'sb_admin', 'sb_user',
      'logged_in', 'login_expire', 'is_admin',
      'visitor_verified', 'mode', 'visitor_from_login',
      'bgm_state', 'bgm_muted', 'bgm_played',
      'last_register_submit', 'last_ticket_submit'
    ];
    keysToRemove.forEach(function(key){
      try{ localStorage.removeItem(key); }catch(e){}
    });
    // 批量清除所有以sb_、user_、auth_、token_开头的字段
    for(var i = localStorage.length - 1; i >= 0; i--){
      var key = localStorage.key(i);
      if(key && (key.indexOf('sb_') === 0 || key.indexOf('user_') === 0 || key.indexOf('auth_') === 0 || key.indexOf('token_') === 0)){
        localStorage.removeItem(key);
      }
    }
    // 保留验证状态_v，避免重新触发人机验证
    var _v = sessionStorage.getItem('_v');
    sessionStorage.clear();
    if(_v) sessionStorage.setItem('_v', _v);
    // 清除背景音乐状态
    if(window.BGM && typeof BGM.clearAllState === 'function'){
      BGM.clearAllState();
    }
  }catch(e){
    console.error('退出登录出错:', e);
  }
  showToast('已退出登录，所有用户信息已清除', 'success');
  setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1000);
}

function goBack(){
  try{
    var isAdmin = sessionStorage.getItem('is_admin') === '1' || localStorage.getItem('is_admin') === '1';
    var isVisitor = sessionStorage.getItem('mode') === 'visitor' || sessionStorage.getItem('visitor_verified');
    if(isVisitor){
      location.href = 'https://cqxjw-class7-2020-2.pages.dev/visitor.html';
    }else if(isAdmin || (currentUser && (currentUser.role === 'admin' || currentUser.role === 'super_admin'))){
      location.href = 'https://cqxjw-class7-2020-2.pages.dev/admin-main.html';
    }else if(currentUser){
      location.href = 'https://cqxjw-class7-2020-2.pages.dev/a3x7k2m9p4q8r3t6w1y5u0i2o4.html';
    }else{
      location.href = 'https://cqxjw-class7-2020.pages.dev/login.html';
    }
  }catch(e){
    console.error('goBack错误:', e);
    location.href = 'https://cqxjw-class7-2020.pages.dev/login.html';
  }
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'info');
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
